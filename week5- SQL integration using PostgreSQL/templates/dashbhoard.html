<!DOCTYPE html>
<html>

<head>

    <title>Prediction Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>Prediction History</h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Tenure</th>
            <th>Monthly Charges</th>
            <th>Prediction</th>
        </tr>

        {% for record in records %}

        <tr>

            <td>{{ record[0] }}</td>

            <td>{{ record[1] }}</td>

            <td>{{ record[2] }}</td>

            <td>{{ record[3] }}</td>

        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="/">
        <button>Back</button>
    </a>

</div>

</body>

</html>
